<meta name="theme-color" content="#100F0C" media="(prefers-color-scheme: dark)">

<meta property="og:description" content="Dye Yellow Studios, LLC — an independent studio making retro-inspired games that people love.">
<meta property="og:type" content="website">

<script>
  /* Runs before paint so a saved choice never flashes the wrong theme. */
  (function () {
    try {
      var saved = localStorage.getItem('dys-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode / blocked storage: fall back to the OS setting */ }
  })();
</script>

<style>
  /* ---- Light (default) ---- */
  :root {
    /* The page's own theme, told to the browser. Without this the UA
       follows the OS, and the strip behind Safari's bottom bar stays
       light while an explicitly dark page sits above it. */
    color-scheme: light;

    --yellow: #F7E733;        /* lemon, both themes */
    --bg: #FAF8F3;
    --fg: #111110;
    --muted: #605D56;
    --rule: rgba(17, 17, 16, 0.12);
    --on-yellow: #111110;     /* text that sits on the accent */
    --logo: #111110;
    --mark-start: 58%;   /* partial sweep reads well on paper */
    --cta-border: #111110;
    --cta-shadow: rgba(17, 17, 16, 0.9);
    --max: 680px;
  }

  /* ---- Dark: same lemon as light mode ---- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --yellow: #F7E733;
      --bg: #100F0C;
      --fg: #F2F2EC;
      --muted: #8E9086;
      --rule: rgba(242, 242, 236, 0.14);
      --on-yellow: #100F0C;
      --logo: #F7E733;
      --mark-start: 8%;    /* full swipe: text on the sweep is dark */
      --cta-border: transparent;
      --cta-shadow: rgba(247, 231, 51, 0.35);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --yellow: #F7E733;
    --bg: #100F0C;
    --fg: #F2F2EC;
    --muted: #8E9086;
    --rule: rgba(242, 242, 236, 0.14);
    --on-yellow: #100F0C;
    --logo: #F7E733;
    --mark-start: 8%;
    --cta-border: transparent;
    --cta-shadow: rgba(247, 231, 51, 0.35);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  html { background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 64px 16px 48px;
  }

  .wrap {
    width: 100%;
    max-width: var(--max);
  }

  .logo {
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
    fill: var(--logo);
  }

  h1 {
    font-size: clamp(0.8rem, 2.4vw, 0.95rem);
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .tagline {
    font-size: clamp(1.05rem, 2.6vw, 1.25rem);
    color: var(--muted);
    margin: 0 auto 36px;
    max-width: 30em;
  }

  .mark {
    /* highlighter sweep behind a few words */
    background: linear-gradient(transparent var(--mark-start), var(--yellow) var(--mark-start));
    color: var(--on-yellow);
    padding: 0 3px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .cta {
    display: inline-block;
    background: var(--yellow);
    color: var(--on-yellow);
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 999px;
    border: 2px solid var(--cta-border);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:hover, .cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 var(--cta-shadow);
  }

  footer {
    flex: none;
    border-top: 1px solid var(--rule);
    padding: 24px 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer a { color: var(--muted); }

  footer p { margin: 0; }

  .made {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 7px;
    letter-spacing: 0.01em;
  }

  /* Sized in em so it tracks the footer text if that ever changes. */
  /* Outline derived from county geometry, rotated 6.5deg so the
     Indiana border reads vertical. Ohio is taller than it is wide. */
  .ohio {
    height: 1.15em;
    width: auto;
    aspect-ratio: 41.7 / 47.07;
    fill: currentColor;
    flex: none;
  }

  .legal { opacity: 0.75; }

  @media (max-width: 480px) {
    main { padding-top: 40px; }
    .logo { max-width: 240px; margin-bottom: 24px; }
  }

  /* ---- Theme toggle ---- */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .theme-toggle:hover {
    color: var(--fg);
    border-color: var(--fg);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--yellow);
    outline-offset: 3px;
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
  }

  .theme-toggle[hidden] { display: none; }

  /* Show the icon for the theme you'd switch TO. Light showing = moon. */
  .icon-sun { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-sun { display: block; }
    :root:not([data-theme="light"]) .icon-moon { display: none; }
  }

  :root[data-theme="dark"] .icon-sun { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }

  :root[data-theme="light"] .icon-sun { display: none; }
  :root[data-theme="light"] .icon-moon { display: block; }


  /* ---- The Ohio, on touch devices only (the button is built in JS) ---- */

  .ohio-btn {
    position: relative;
    display: inline-flex;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    line-height: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* A 44px target laid over the mark: big enough for a thumb, and it
     changes no layout, so the footer line is identical either way. */
  .ohio-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
  }

  .ohio-btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 6px; }

  /* ---- The ambient layer (off until someone types the word) ---- */

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 700ms ease;
  }

  :root.magic #sky { opacity: 1; }

  /* Everything on the page sits above the framebuffer. The toggle is
     already fixed with its own z-index, so it is left alone here. */
  main, footer { position: relative; z-index: 1; }

  /* The ground rises rather than appearing, so the word feels like a cause. */
  .ground {
    /* The sky is fixed to the viewport. If the ground scrolled with the
       page, the two halves of one scene would slide against each other.
       Sticky holds it on the bottom edge while there is page below it,
       then lets it settle into its real place above the footer. */
    position: sticky;
    bottom: 0;
    z-index: 1;
    flex: none;
    height: 0;
    background-repeat: repeat-x;
    background-position: left bottom;
    image-rendering: pixelated;
    transition: height 460ms cubic-bezier(0.2, 0.75, 0.25, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    #sky, .ground { transition: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover, .cta:focus-visible { transform: none; }
    .theme-toggle { transition: none; }
  }
</style>

        root.setAttribute('data-theme', next);
        try {
          localStorage.setItem('dys-theme', next);
        } catch (e) { /* choice just won't survive the visit */ }

        syncChrome(next);
      });

      /* No explicit choice yet? Follow the OS if it changes mid-visit. */
      var onSystemChange = function () {
        if (!root.hasAttribute('data-theme')) syncLabel();
      };
      if (mql.addEventListener) mql.addEventListener('change', onSystemChange);
      else if (mql.addListener) mql.addListener(onSystemChange);

      btn.hidden = false;

      var c = document.createElement('canvas');
      c.width = WEB_R + 1;

          kind: 'ghost', dir: dir,
          /* On first load they are already partway across: nobody should
             have to wait 40 seconds for the page to have a ghost in it. */
          x: recycle ? (dir > 0 ? -14 : W + 4) : rand(-10, W - 6),
          y: rand(H * 0.12, Math.max(H * 0.24, floorY * 0.62)),
          vx: dir * rand(0.35, 0.6),
          phase: rand(0, 6.28), f: 0, ft: 0
        };
      },
      bee: function () { return wanderer('bee'); },
      fly: function () { return wanderer('fly'); },
      bat: function () { return wanderer('bat'); }
    };

    function wanderer(kind) {
      return {
        kind: kind,
        x: rand(0, W), y: rand(H * 0.1, Math.max(H * 0.2, floorY * 0.9)),
        vx: rand(-0.5, 0.5), vy: rand(-0.2, 0.2),
        tx: rand(0, W), ty: rand(H * 0.08, Math.max(H * 0.2, floorY * 0.85)),
        hold: 0, f: 0, amp: 0,
        phase: rand(0, 6.28),
        period: kind === 'fly' ? rand(14, 34) : 0
      };
    }

    function spawnRocket() {
      return {
        kind: 'rocket', x: rand(W * 0.08, W * 0.92), y: floorY || H,
        vy: -rand(1.5, 2.6), peak: rand(H * 0.08, H * 0.46),
        shell: SHELL[(Math.random() * SHELL.length) | 0]
      };
    }

    /* Two shapes: a fast peony, and a slower willow that hangs and drips. */
    function burst(x, y, shell) {
      var willow = Math.random() < 0.3;
      var n = (willow ? 22 : 26) + ((Math.random() * 10) | 0);
      for (var i = 0; i < n; i++) {
        var a = (i / n) * 6.283 + rand(-0.14, 0.14);
        var sp = willow ? rand(0.3, 0.85) : rand(0.5, 1.75);
        var life = willow ? 26 + ((Math.random() * 16) | 0) : 14 + ((Math.random() * 12) | 0);
        parts.push({
          kind: 'spark', x: x, y: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: life, max: life,
          grav: willow ? 0.028 : 0.05,
          col: Math.random() < 0.35 ? shell[1] : shell[0]
        });
      }
    }

    function buildLights() {
      lights = [];
      if (!conf().lights || CFG.count <= 0) return;
      var swag = 62, sag = 13, top = 4;
      var n = Math.ceil(W / swag) + 1, i = 0;
      for (var s = 0; s < n; s++) {
        for (var b = 1; b <= 3; b++) {
          var t = b / 4;
          var x = s * swag + t * swag;
          if (x > W + 4) continue;
          lights.push({
            x: Math.round(x),
            y: Math.round(top + Math.sin(t * Math.PI) * sag),
            bulb: BULBS[i % BULBS.length],
            period: 14 + ((Math.random() * 16) | 0),
            offset: (Math.random() * 30) | 0
          });
          i++;
        }
      }
      lights.sag = sag;
      lights.swag = swag;
      lights.top = top;
    }

    function populate() {
      parts = [];
      var air = conf().air || {};
      Object.keys(air).forEach(function (kind) {
        var fn = SPAWN[kind];
        if (!fn) return;
        var wandering = kind === 'bee' || kind === 'fly' || kind === 'bat';
        var n = Math.round(air[kind] * CFG.count);
        if (wandering && CFG.count > 0) n = Math.max(1, n);
        for (var i = 0; i < n; i++) parts.push(fn(false));
      });
      buildLights();
      nextRocket = 24;
    }

    function resize() {
      W = Math.max(1, Math.ceil(window.innerWidth / CFG.px));
      H = Math.max(1, Math.ceil(window.innerHeight / CFG.px));
      canvas.width = W;
      canvas.height = H;
      ctx.imageSmoothingEnabled = false;
      measureFloor();
      populate();
      draw();
    }

    /* The ground strip is a DOM element; read where it actually sits so
       sprites settle onto it instead of at some guessed fraction. */
    function measureFloor() {
      var top = H * 0.88;
      try {
        var r = ground.getBoundingClientRect();
        if (r.height > 0 || r.top > 0) top = r.top / CFG.px;
      } catch (e) {}
      floorY = Math.max(20, Math.min(H, Math.round(top)));
    }

    function steer(p, k, max) {
      if (--p.hold <= 0) {
        p.tx = rand(10, W - 10);
        p.ty = rand(H * 0.08, Math.max(H * 0.2, floorY * 0.85));
        p.hold = 28 + ((Math.random() * 40) | 0);
      }
      var dx = p.tx - p.x, dy = p.ty - p.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      p.vx += (dx / d) * k;
      p.vy += (dy / d) * k;
      p.vx *= 0.9;
      p.vy *= 0.9;
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp > max) { p.vx *= max / sp; p.vy *= max / sp; }
      p.x += p.vx * CFG.speed;
      p.y += p.vy * CFG.speed;
    }

    function update() {
      tick++;

      if (conf().fireworks && CFG.count > 0) {
        nextRocket -= CFG.speed;
        if (nextRocket <= 0) {
          /* Mostly singles, with the odd salvo, the way a real show paces. */
          var salvo = Math.random() < 0.3 ? 2 + ((Math.random() * 2) | 0) : 1;
          for (var r = 0; r < salvo; r++) parts.push(spawnRocket());
          nextRocket = (11 + Math.random() * 20) / Math.max(0.3, CFG.count);
        }
      }

      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];

        if (p.kind === 'snow') {
          p.y += p.vy * CFG.speed;
          p.x += (p.drift + Math.sin(p.y * 0.06 + p.phase) * 0.22) * CFG.speed;
          if (p.x < -6) p.x = W + 4;
          if (p.x > W + 6) p.x = -4;
          if (p.y > floorY + 6) parts[i] = SPAWN.snow(true);
        } else if (p.kind === 'leaf' || p.kind === 'petal' || p.kind === 'fluff' || p.kind === 'heart') {
          p.y += p.vy * CFG.speed;
          p.phase += p.ps * CFG.speed;
          if (++p.ft >= p.every) { p.ft = 0; p.f = (p.f + 1) % 4; }
          if (p.y > floorY + 10) parts[i] = SPAWN[p.re](true);
        } else if (p.kind === 'bee') {
          steer(p, 0.07, 0.9);
          p.y += Math.sin(tick * 0.5 + p.phase) * 0.12;
          p.f ^= 1;
        } else if (p.kind === 'ghost') {
          p.x += p.vx * CFG.speed;
          p.phase += 0.09 * CFG.speed;
          p.y += Math.sin(p.phase) * 0.3 * CFG.speed;
          if (++p.ft >= 3) { p.ft = 0; p.f ^= 1; }
          if (p.dir > 0 ? p.x > W + 8 : p.x < -18) parts[i] = SPAWN.ghost(true);
        } else if (p.kind === 'bat') {
          steer(p, 0.05, 0.75);
          p.f ^= 1;
        } else if (p.kind === 'fly') {
          steer(p, 0.03, 0.45);
          p.phase += (6.28 / p.period) * CFG.speed;
        } else if (p.kind === 'rocket') {
          p.y += p.vy * CFG.speed;
          if (p.y <= p.peak) {
            burst(p.x, p.y, p.shell);
            parts.splice(i, 1);
          }
        } else if (p.kind === 'spark') {
          p.vy += (p.grav || 0.05) * CFG.speed;
          p.x += p.vx * CFG.speed;
          p.y += p.vy * CFG.speed;
          p.life -= CFG.speed;
          if (p.life <= 0) parts.splice(i, 1);
        }
      }
    }

    /* Fade anything in the last stretch so it settles into the ground line
       instead of being clipped by it. */
    function alphaAt(y, base) {
      var a = base * CFG.alpha;
      var fade = 20;
      if (y > floorY - fade) a *= Math.max(0, 1 - (y - (floorY - fade)) / (fade + 6));
      return Math.max(0, Math.min(1, a));
    }

    function blit(img, x, y, flip) {
      x = Math.round(x);
      y = Math.round(y);
      if (flip) {
        ctx.save();
        ctx.translate(x + img.width, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
      } else {
        ctx.drawImage(img, x, y);
      }
    }

    function drawLights() {
      if (!lights.length) return;
      ctx.globalAlpha = CFG.alpha;
      ctx.fillStyle = P('wire');
      for (var x = 0; x <= W; x++) {
        var t = (x % lights.swag) / lights.swag;
        ctx.fillRect(x, Math.round(lights.top + Math.sin(t * Math.PI) * lights.sag), 1, 1);
      }
      for (var i = 0; i < lights.length; i++) {
        var L = lights[i];
        var per = Math.max(3, L.period / CFG.blink);
        var on = reduce ? true : ((tick + L.offset) % per) < per * 0.68;
        blit(on ? L.bulb.on : L.bulb.off, L.x - 1, L.y + 1, false);
      }
    }

    /* Fixtures stand on the ground line, clipped just into the soil so the
       groundhog can rise out of it. */
    function drawFixture() {
      var f = conf().fixture;
      if (!f || CFG.count <= 0) return;
      var baseline = floorY + 3;

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, baseline);
      ctx.clip();
      ctx.globalAlpha = 1;

      if (f === 'pumpkin') {
        var img = PUMPKIN[reduce ? 0 : (Math.abs((Math.sin(tick * 0.7) + Math.sin(tick * 0.31)) * 1.6) | 0) % 3];
        blit(img, Math.round(W * 0.21), baseline - img.height, false);
      } else if (f === 'hog') {
        /* 14s cycle: buried, rising, up, ducking. */
        var T = reduce ? 80 : tick % 170;
        var up = 0;
        if (T < 48) up = 0;
        else if (T < 60) up = (T - 48) / 12;
        else if (T < 110) up = 1;
        else if (T < 122) up = 1 - (T - 110) / 12;
        if (up > 0) {
          blit(HOG, Math.round(W * 0.7), baseline - Math.round(HOG.height * up), false);
        }
      }
      ctx.restore();
    }

    /* The web hangs in the top-left corner: the only corner the page leaves
       empty (the toggle owns top-right, the panel bottom-left). */
    function drawWeb() {
      if (!conf().web || CFG.count <= 0) return;

      ctx.globalAlpha = Math.min(1, CFG.alpha);
      blit(WEB, 0, 0, false);

      /* 20s cycle: sat in the web, lowering, hanging, climbing back. */
      var T = reduce ? 90 : tick % 250;
      var drop = 0;
      if (T < 44) drop = 0;
      else if (T < 80) drop = (T - 44) / 36;
      else if (T < 180) drop = 1;
      else if (T < 216) drop = 1 - (T - 180) / 36;

      var anchor = 20;
      var base = 24;
      var len = Math.round(drop * 30);
      var dx = len > 0 ? Math.sin(tick * 0.11) * 2.2 * CFG.sway : 0;

      ctx.fillStyle = P('web');
      for (var i = 0; i < len; i++) {
        ctx.fillRect(anchor + Math.round(dx * (i / len)), base + i, 1, 1);
      }

      var img = SPIDER[reduce ? 0 : (tick >> 1) & 1];
      blit(img, anchor + Math.round(dx) - 4, base + len, false);
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      if (!ON || CFG.count <= 0) return;

      drawLights();
      drawWeb();

      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        var sx = p.x + Math.sin(p.phase) * (p.amp || 0) * CFG.sway;

        if (p.kind === 'leaf') {
          ctx.globalAlpha = alphaAt(p.y, 0.95);
          blit(LEAF[p.set][TUMBLE[p.f]], sx, p.y, false);
        } else if (p.kind === 'heart') {
          ctx.globalAlpha = alphaAt(p.y, 0.9);
          blit(HEART[p.set][p.f % 2], sx, p.y, false);
        } else if (p.kind === 'petal' || p.kind === 'fluff') {
          ctx.globalAlpha = alphaAt(p.y, p.kind === 'fluff' ? 0.8 : 0.85);
          blit(PETAL[p.set][p.f % 2], sx, p.y, false);
        } else if (p.kind === 'snow') {
          ctx.globalAlpha = alphaAt(p.y, p.size === 1 ? 0.62 : 0.92);
          if (p.size === 3) {
            blit(STAR, p.x, p.y, false);
          } else {
            ctx.fillStyle = p.size === 2 ? P('snow') : P('snowDim');
            ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
          }
        } else if (p.kind === 'bee') {
          ctx.globalAlpha = CFG.alpha;
          blit(BEE[p.f], p.x, p.y, p.vx < 0);
        } else if (p.kind === 'ghost') {
          /* Fade across the first and last sixth of the crossing. */
          var span = W + 22;
          var prog = (p.dir > 0 ? p.x + 14 : W + 4 - p.x) / span;
          var env = Math.max(0, Math.min(1, Math.min(prog, 1 - prog) / 0.16));
          ctx.globalAlpha = env * CFG.alpha * 0.9;
          blit(GHOST[p.f], p.x, p.y, false);
        } else if (p.kind === 'bat') {
          ctx.globalAlpha = CFG.alpha;
          blit(BAT[p.f], p.x, p.y, p.vx < 0);
        } else if (p.kind === 'fly') {
          /* Cubed sine: mostly dark with a short bright flash. */
          var g = Math.pow((Math.sin(p.phase) + 1) / 2, 3);
          ctx.globalAlpha = Math.min(1, g * CFG.alpha);
          if (g > 0.5) {
            blit(FLY, p.x - 1, p.y - 1, false);
          } else {
            ctx.fillStyle = P('flyCore');
            ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
          }
        } else if (p.kind === 'rocket') {
          ctx.globalAlpha = CFG.alpha;
          ctx.fillStyle = p.shell[1];
          ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 2);
          ctx.globalAlpha = Math.min(1, CFG.alpha * 0.4);
          ctx.fillRect(Math.round(p.x), Math.round(p.y) + 2, 1, 3);
        } else if (p.kind === 'spark') {
          ctx.globalAlpha = Math.min(1, (p.life / p.max) * CFG.alpha);
          ctx.fillStyle = p.col;
          ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
        }
      }

      ctx.globalAlpha = 1;
      drawFixture();
    }

    function loop(now) {
      raf = window.requestAnimationFrame(loop);
      if (now - last < 1000 / CFG.fps) return;
      last = now;
      update();
      draw();
    }

    function start() {
      if (raf || reduce || !ON || CFG.count <= 0 || document.hidden) return;
      last = 0;
      raf = window.requestAnimationFrame(loop);
    }

    function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = 0; } }

    function setGround() {
      var name = 'tile' + conf().ground;
      var rows = ON && CFG.ground ? ART[name] : null;
      if (!rows) {
        ground.style.backgroundImage = 'none';
        ground.style.height = '0px';
        return;
      }
      var c = bake(rows, tileKey(name));
      ground.style.backgroundImage = 'url(' + c.toDataURL() + ')';
      ground.style.backgroundSize = (c.width * CFG.px) + 'px ' + (c.height * CFG.px) + 'px';
      ground.style.height = (c.height * CFG.px) + 'px';
    }

    function applyAll() {
      setGround();
      resize();
      stop();
      start();
      if (reduce) draw();
    }

    /* ---------- the word ---------- */
    function setMagic(on) {
      ON = !!on;
      document.documentElement.classList.toggle('magic', ON);
      applyAll();
      try { window.localStorage.setItem(MAGIC_KEY, ON ? '1' : '0'); } catch (e) {}
    }

    var typed = '';
    document.addEventListener('keydown', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      var t = ev.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      var k = (ev.key || '').toLowerCase();
      if (k.length !== 1 || k < 'a' || k > 'z') return;
      typed = (typed + k).slice(-MAGIC_WORD.length);
      if (typed === MAGIC_WORD) {
        typed = '';
        setMagic(!ON);
      }
    });

    function onTheme() {
      var next = currentTheme();
      if (next === THEME) return;
      THEME = next;
      rebake();
      setGround();
      draw();
    }

    /* A phone has no keyboard to type into, so the Ohio becomes the way in.
       The button exists only where the primary pointer is a finger, and is
       built here rather than in the markup so a desktop visitor gets a plain
       graphic: nothing to tab to, nothing to click. The change listener
       matters more than it looks — attaching or detaching an iPad keyboard
       flips this mid-visit, and without it a visitor is left with neither
       route in. */
    var coarse = window.matchMedia('(hover: none) and (pointer: coarse)');
    var ohio = document.querySelector('.ohio');
    var ohioBtn = null;

    function wireOhio() {
      if (!ohio) return;

      if (coarse.matches && !ohioBtn) {
        ohioBtn = document.createElement('button');
        ohioBtn.type = 'button';
        ohioBtn.className = 'ohio-btn';
        ohioBtn.setAttribute('aria-label', 'Made in Ohio');
        ohio.parentNode.insertBefore(ohioBtn, ohio);
        ohioBtn.appendChild(ohio);
        ohioBtn.addEventListener('click', function () { setMagic(!ON); });
      } else if (!coarse.matches && ohioBtn) {
        ohioBtn.parentNode.insertBefore(ohio, ohioBtn);
        ohioBtn.parentNode.removeChild(ohioBtn);
        ohioBtn = null;
      }
    }

    wireOhio();
    if (coarse.addEventListener) coarse.addEventListener('change', wireOhio);
    else if (coarse.addListener) coarse.addListener(wireOhio);

    /* index.html owns the toggle. Watch the attribute it sets, and the OS
       setting, so the sprite palettes follow the theme either way. */
    if (window.MutationObserver) {
      new MutationObserver(onTheme).observe(document.documentElement, {
        attributes: true, attributeFilter: ['data-theme']
      });
    }
    if (mql.addEventListener) mql.addEventListener('change', onTheme);
    else if (mql.addListener) mql.addListener(onTheme);


    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else start();
    });

    /* While the ground is pinned, the floor sits a fixed distance from the
       bottom of the screen; as it releases, it moves. Re-measure on scroll
       so sprites always land on the line that is actually drawn. */
    var sTick = 0;
    window.addEventListener('scroll', function () {
      if (sTick || !ON) return;
      sTick = window.requestAnimationFrame(function () {
        sTick = 0;
        measureFloor();
      });
    }, false);

    var rt;
    window.addEventListener('resize', function () {
      window.clearTimeout(rt);
      rt = window.setTimeout(function () { setGround(); resize(); }, 150);
    });

    rebake();
    scene = CFG.season === 'auto' ? resolve(new Date()) : CFG.season;
    if (!SCENES[scene]) { CFG.season = 'auto'; scene = resolve(new Date()); }

    /* Once found, it stays found. */
    var remembered = false;
    try { remembered = window.localStorage.getItem(MAGIC_KEY) === '1'; } catch (e) {}
    setMagic(FORCED || remembered);
  })();
  </script>
</body>
</html>
