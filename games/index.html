<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games — Dye Yellow Studios</title>
<meta name="description" content="Playable prototypes from Dye Yellow Studios.">
<link rel="icon" href="../dye-yellow-logo.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --yellow: #F7E733;
    --bg: #FAF8F3;
    --fg: #111110;
    --muted: #605D56;
    --rule: rgba(17, 17, 16, 0.12);
    --on-yellow: #111110;
    --cta-border: #111110;
    --cta-shadow: rgba(17, 17, 16, 0.9);
    --card-bg: #FFFDF7;
    --max: 680px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #100F0C;
      --fg: #F2F2EC;
      --muted: #8E9086;
      --rule: rgba(242, 242, 236, 0.14);
      --on-yellow: #100F0C;
      --cta-border: transparent;
      --cta-shadow: rgba(247, 231, 51, 0.35);
      --card-bg: #1B1A15;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html, body { background: var(--bg); }

  body {
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .wrap {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto;
    padding: 64px 16px 72px;
    flex: 1;
  }

  .eyebrow {
    font-size: clamp(0.8rem, 2.4vw, 0.95rem);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin: 0 0 32px;
  }

  .lede {
    color: var(--muted);
    text-align: center;
    max-width: 420px;
    margin: 0 auto 40px;
  }

  .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }

  .game {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 24px;
  }

  .game h2 { font-size: 1.25rem; margin: 0 0 4px; }

  .game .meta {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .game p { margin: 0 0 20px; color: var(--muted); }

  .cta {
    display: inline-block;
    background: var(--yellow);
    color: var(--on-yellow);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 999px;
    border: 2px solid var(--cta-border);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:hover, .cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 var(--cta-shadow);
  }

  footer {
    border-top: 1px solid var(--rule);
    padding: 24px 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover, .cta:focus-visible { transform: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Dye Yellow Studios</p>

  <p class="lede">
    Prototypes we're testing. They're password-protected while they're rough —
    <a href="/#contact">ask for the password</a> and we'll send it over.
  </p>

  <ul class="games">
    <li class="game">
      <h2>Calendar game</h2>
      <p class="meta">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Password required · Prototype
      </p>
      <p>An arcade prototype about defending your calendar.</p>
      <a class="cta" href="/games/calendar/">Play</a>
    </li>
  </ul>
</div>

<footer>
  <a href="/">&larr; Dye Yellow Studios</a>
</footer>

</body>
</html>
